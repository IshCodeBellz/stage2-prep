<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2-Hand — co-ordination</title>
<meta name="description" content="2-Hand player — two hands, one cursor, a winding track.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/design.css">

<body data-nav="none">

<main class="shell w900">

  <div class="playerbar">
    <div class="who">
      <span class="name">2-Hand co-ordination</span>
      <span class="tag practice">PRACTICE · TRACK 2 OF 4</span>
    </div>
    <span class="clock live">00:47</span>
  </div>

  <div class="hand-wrap">
    <div class="hand-track">
      <!-- The channel, the centre line, the path taken so far, and the cursor
           where it has got to. The live app draws this on a canvas. -->
      <svg viewBox="0 0 600 340" role="img" aria-label="A winding channel with the cursor part-way along it">
        <path d="M40,300 C120,300 140,60 280,60 S420,280 560,220" fill="none" stroke="#eceef0" stroke-width="34" stroke-linecap="round"></path>
        <path d="M40,300 C120,300 140,60 280,60 S420,280 560,220" fill="none" stroke="#d7dce0" stroke-width="2" stroke-dasharray="6 8"></path>
        <path d="M40,300 C100,300 120,120 210,86" fill="none" stroke="#2fbf71" stroke-width="5" stroke-linecap="round"></path>
        <circle cx="210" cy="86" r="11" fill="#0b6e4f"></circle>
      </svg>
      <span class="hand-off">off-track time: 1.8s</span>
    </div>

    <div class="hand-side">
      <div class="hand-key">
        <div class="which">LEFT HAND</div>
        <div class="keys">← → keys</div>
        <div class="does">moves the cursor across</div>
      </div>
      <div class="hand-key">
        <div class="which">RIGHT HAND</div>
        <div class="keys">↑ ↓ keys</div>
        <div class="does">moves the cursor up and down</div>
      </div>
      <p class="hand-tip">Scored on time off the track, not speed. Slow and clean beats fast and ragged.</p>
    </div>
  </div>

</main>

<script src="/assets/design.js"></script>
