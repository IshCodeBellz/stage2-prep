<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAFV — vigilance</title>
<meta name="description" content="WAFV player — thirty minutes of vigilance.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/design.css">

<body data-nav="none">

<main class="shell w900">

  <div class="playerbar">
    <div class="who">
      <span class="name">WAFV vigilance</span>
      <span class="tag exam">EXAM · 30 MIN</span>
    </div>
    <span class="clock">21:44 left</span>
  </div>

  <!-- Nothing happens here for minutes at a time. That is the test, so the
       screen is deliberately empty apart from the lamp and the tally. -->
  <div class="vig">
    <div class="vig-tally">hits 41 · missed 2 · false 1</div>
    <div class="vig-ring"><div class="vig-lamp"></div></div>
    <p class="vig-help">Press the space bar the moment the circle brightens. Nothing else happens — the difficulty is the length.</p>
  </div>

  <div class="playerfoot">
    <span class="hint">Screen stays dark on purpose — matching the real test room.</span>
    <a class="btn" href="/design" style="padding:9px 18px;border-radius:8px">Abandon run</a>
  </div>

</main>

<script src="/assets/design.js"></script>
